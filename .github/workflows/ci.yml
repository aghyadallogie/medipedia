name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medipedia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medipedia
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@127.0.0.1:5432/medipedia
      PAYLOAD_SECRET: ci-payload-secret-not-used-in-production-000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # Proves the committed migrations build the whole schema from an empty database.
      - run: pnpm --filter @medipedia/web migrate

      # Integration tests create and drop their own schema in the same database.
      - run: pnpm test:int

      - run: pnpm build
